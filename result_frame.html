<style>
#item-details1,[id^="item-details"],[class*="ItemDetails"]{
  display:none!important;height:0!important;overflow:hidden!important;
  margin:0!important;padding:0!important;
}
#result-iframe{
  width:100%;border:none;display:block;min-height:100vh;
}
#bs-loading{
  position:fixed;inset:0;
  background:linear-gradient(160deg,#F5F3FF,#EEF5FF);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:9999;
  transition:opacity .5s ease, visibility .5s ease;
}
#bs-loading.hide{
  opacity:0;visibility:hidden;pointer-events:none;
}
.bs-logo{display:flex;align-items:center;gap:10px;margin-bottom:40px;}
.bs-logo-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#7161EC,#9688F0);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;box-shadow:0 4px 16px rgba(113,97,236,.45);}
.bs-logo-name{font-size:18px;font-weight:900;color:#3D2F8F;font-family:'Apple SD Gothic Neo',sans-serif;}
.bs-spinner-wrap{position:relative;width:80px;height:80px;margin-bottom:28px;}
.bs-spinner{position:absolute;inset:0;border-radius:50%;border:4px solid #EEEDFE;border-top:4px solid #7161EC;animation:bsspin 1s linear infinite;}
.bs-spinner-inner{position:absolute;inset:10px;border-radius:50%;border:3px solid transparent;border-top:3px solid #9688F0;animation:bsspin .6s linear infinite reverse;}
@keyframes bsspin{to{transform:rotate(360deg)}}
.bs-title{font-size:17px;font-weight:900;color:#1A1830;margin-bottom:8px;font-family:'Apple SD Gothic Neo',sans-serif;}
.bs-desc{font-size:13px;color:#8A88A0;text-align:center;line-height:1.7;font-family:'Apple SD Gothic Neo',sans-serif;}
.bs-dots{display:flex;gap:5px;margin-top:20px;}
.bs-dot{width:8px;height:8px;border-radius:50%;background:#7161EC;opacity:.3;animation:bsdot .9s ease-in-out infinite;}
.bs-dot:nth-child(2){animation-delay:.15s;}
.bs-dot:nth-child(3){animation-delay:.3s;}
@keyframes bsdot{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:1;transform:scale(1.3);}}
</style>

<!-- 로딩 오버레이 -->
<div id="bs-loading">
  <div class="bs-logo">
    <div class="bs-logo-mark">B</div>
    <div class="bs-logo-name">뷰티스코어</div>
  </div>
  <div class="bs-spinner-wrap">
    <div class="bs-spinner"></div>
    <div class="bs-spinner-inner"></div>
  </div>
  <div class="bs-title">분석 결과를 불러오는 중</div>
  <div class="bs-desc">원장님 매장 데이터를<br>분석하고 있습니다</div>
  <div class="bs-dots">
    <div class="bs-dot"></div>
    <div class="bs-dot"></div>
    <div class="bs-dot"></div>
  </div>
</div>

<iframe id="result-iframe" src="" frameborder="0" scrolling="yes"></iframe>

<script>
(function(){
  /* ★ 현재 페이지 URL에서 recordId 추출 */
  var pageRecordId = (new URLSearchParams(window.location.search)).get('recordId') || '';

  function hideLoading(){
    var el=document.getElementById('bs-loading');
    if(el) el.classList.add('hide');
  }

  function pick(f,ks){
    for(var i=0;i<ks.length;i++){
      var v=f[ks[i]];
      if(v!==undefined&&v!==null){
        var s=Array.isArray(v)?v[0]:v;
        if(s!==null&&String(s).trim()!=='')return String(s).trim();
      }
    }return '';
  }

  function loadIframe(f){
    var params=new URLSearchParams();

    /* ★ recordId 포함 — result_frame.html의 대시보드/요금제 링크에 자동 주입 */
    var rid = pageRecordId || pick(f,['전환ID','대시보드_토큰','recordId']) || '';
    if(rid) params.set('recordId', rid);

    params.set('store',   pick(f,['매장명','매장명_f']));
    params.set('score',   pick(f,['진단점수_f','진단점수','종합점수_f','종합점수']));
    params.set('grade',   pick(f,['진단등급','진단등급_f']));
    params.set('rank',    pick(f,['상위점수_표시','상위점수_표시_f']));
    params.set('issue',   pick(f,['문제유형','문제유형_f']));
    params.set('rv',      pick(f,['재방문율점수_f','재방문율_점수_f','재방문율_점수','재방문율점수']));
    params.set('cn',      pick(f,['상담전환율점수_f','상담전환율_점수_f','상담전환율_점수','상담전환율점수']));
    params.set('st',      pick(f,['매출구조점수_f','매출구조_점수_f','매출구조_점수','매출구조점수']));
    params.set('fr',      pick(f,['데이터확인빈도점수_f','데이터확인빈도_점수_f','데이터확인빈도_점수','데이터확인빈도점수']));
    params.set('analysis',pick(f,['문제유형해석','문제유형해석_f','결과요약','결과요약_f']));
    params.set('tg',      pick(f,['데이터신뢰도등급_f','데이터신뢰도등급']));
    params.set('td',      pick(f,['데이터신뢰도_문구_f','데이터신뢰도_문구']));

    var dt=pick(f,['토큰생성일시','토큰생성일시_f','Created Time','진단일시','생성일']);
    if(dt){
      try{
        var d=new Date(dt);
        var dy=['일','월','화','수','목','금','토'];
        params.set('date',d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+dy[d.getDay()]+')');
      }catch(e){}
    }

    var url='https://beautyscore.github.io/beautyscore-result/result_frame.html?'+params.toString()+'&v='+Date.now();
    console.log('[BS] iframe URL:', url);
    console.log('[BS] recordId:', rid);
    document.getElementById('result-iframe').src=url;
  }

  /* iframe에서 높이 메시지 오면 로딩 숨기기 */
  window.addEventListener('message',function(e){
    if(e.data&&e.data.type==='BS_HEIGHT'){
      hideLoading();
    }
  });

  /* Softr 이벤트 수신 */
  ['1','2','3','4'].forEach(function(n){
    window.addEventListener('get-record-item-details'+n,function(e){
      console.log('[BS] 이벤트 수신 event'+n, e.detail);
      if(e.detail) loadIframe(e.detail.fields||e.detail);
    });
    window.addEventListener('get-record-list-details'+n,function(e){
      if(e.detail) loadIframe(e.detail.fields||e.detail);
    });
  });

  /* 12초 타임아웃 */
  setTimeout(function(){
    hideLoading();
  },12000);

  console.log('[BS] /result 코드 로드. recordId:', pageRecordId);
})();
</script>
